<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="monospace">
  <rect width="800" height="560" fill="#FAFAF7"/>
  <rect x="14" y="14" width="772" height="532" fill="none" stroke="#1B1E22" stroke-width="2"/>
  <text x="32" y="44" font-size="15" fill="#1B1E22" font-weight="bold">PLAN D'IMPLANTATION ÉLECTRIQUE — PLATEAU BUREAUX R+1</text>

  <!-- Murs extérieurs -->
  <rect x="70" y="80" width="540" height="340" fill="none" stroke="#1B1E22" stroke-width="5"/>
  <!-- Cloisons -->
  <g stroke="#1B1E22" stroke-width="2" fill="none">
    <line x1="250" y1="80" x2="250" y2="300"/>
    <line x1="250" y1="340" x2="250" y2="420"/>
    <line x1="430" y1="80" x2="430" y2="200"/>
    <line x1="430" y1="240" x2="430" y2="300"/>
    <line x1="70" y1="300" x2="200" y2="300"/>
    <line x1="250" y1="300" x2="610" y2="300"/>
  </g>
  <!-- Portes (arc) -->
  <g stroke="#1B1E22" stroke-width="1" fill="none">
    <path d="M 200 300 A 40 40 0 0 1 240 340" stroke-dasharray="3,3"/>
    <line x1="200" y1="300" x2="200" y2="340" stroke-width="1.6"/>
    <path d="M 430 200 A 40 40 0 0 1 390 240" stroke-dasharray="3,3" transform="rotate(180 410 220)"/>
    <line x1="430" y1="200" x2="430" y2="240" stroke-width="1.6"/>
  </g>

  <!-- Noms des locaux -->
  <g font-size="11" fill="#1B1E22">
    <text x="120" y="180">BUREAU 1</text>
    <text x="115" y="196" font-size="8" fill="#6b7077">21,5 m²</text>
    <text x="300" y="180">BUREAU 2</text>
    <text x="296" y="196" font-size="8" fill="#6b7077">21,5 m²</text>
    <text x="480" y="180">RÉUNION</text>
    <text x="478" y="196" font-size="8" fill="#6b7077">21,5 m²</text>
    <text x="120" y="370">LOCAL TECH.</text>
    <text x="380" y="370">OPEN SPACE — 23,5 m²</text>
  </g>

  <!-- Symboles : prises (cercle + 2 traits), luminaires (cercle croix), interrupteurs (S) -->
  <defs>
    <g id="pc" stroke="#1B1E22" stroke-width="1.4" fill="#FAFAF7">
      <circle r="7"/><line x1="-7" y1="0" x2="-12" y2="0"/><line x1="7" y1="0" x2="12" y2="0"/>
    </g>
    <g id="lum" stroke="#D9480F" stroke-width="1.4" fill="none">
      <circle r="8"/><line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6"/><line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6"/>
    </g>
    <g id="rj45" stroke="#1B1E22" stroke-width="1.3" fill="#FAFAF7">
      <rect x="-6" y="-6" width="12" height="12"/><text y="3" font-size="7" text-anchor="middle" stroke="none" fill="#1B1E22">V</text>
    </g>
  </defs>

  <!-- Implantation bureau 1 -->
  <use href="#pc" x="90" y="110"/><use href="#pc" x="90" y="270"/><use href="#rj45" x="120" y="110"/>
  <use href="#lum" x="160" y="240"/>
  <!-- Bureau 2 -->
  <use href="#pc" x="270" y="110"/><use href="#pc" x="410" y="270"/><use href="#rj45" x="300" y="110"/>
  <use href="#lum" x="340" y="240"/>
  <!-- Réunion -->
  <use href="#pc" x="450" y="110"/><use href="#pc" x="590" y="110"/><use href="#rj45" x="590" y="270"/>
  <use href="#lum" x="520" y="240"/>
  <!-- Open space -->
  <use href="#pc" x="280" y="400"/><use href="#pc" x="400" y="400"/><use href="#pc" x="520" y="400"/>
  <use href="#rj45" x="310" y="400"/><use href="#rj45" x="430" y="400"/>
  <use href="#lum" x="340" y="350"/><use href="#lum" x="470" y="350"/>
  <!-- Local technique : TD -->
  <rect x="86" y="320" width="34" height="20" fill="#FAFAF7" stroke="#D9480F" stroke-width="1.8"/>
  <text x="92" y="334" font-size="9" fill="#D9480F">TD</text>

  <!-- Cotes -->
  <g stroke="#6b7077" stroke-width="1" fill="none">
    <line x1="70" y1="445" x2="610" y2="445"/>
    <line x1="70" y1="438" x2="70" y2="452"/><line x1="610" y1="438" x2="610" y2="452"/>
  </g>
  <text x="318" y="460" font-size="9" fill="#6b7077">12 600</text>
  <g stroke="#6b7077" stroke-width="1" fill="none">
    <line x1="640" y1="80" x2="640" y2="420"/>
    <line x1="633" y1="80" x2="647" y2="80"/><line x1="633" y1="420" x2="647" y2="420"/>
  </g>
  <text x="650" y="255" font-size="9" fill="#6b7077">7 900</text>

  <!-- Légende -->
  <g font-size="9" fill="#1B1E22">
    <rect x="660" y="80" width="118" height="120" fill="#FAFAF7" stroke="#1B1E22" stroke-width="1.4"/>
    <text x="668" y="98" font-weight="bold">LÉGENDE</text>
    <use href="#pc" x="678" y="116"/><text x="698" y="120">PC 16A</text>
    <use href="#lum" x="678" y="144"/><text x="698" y="148">Luminaire</text>
    <use href="#rj45" x="678" y="172"/><text x="698" y="176">RJ45 VDI</text>
  </g>

  <!-- Cartouche -->
  <g font-size="9">
    <rect x="470" y="496" width="316" height="50" fill="#FAFAF7" stroke="#1B1E22" stroke-width="1.6"/>
    <line x1="470" y1="514" x2="786" y2="514" stroke="#1B1E22"/>
    <line x1="620" y1="496" x2="620" y2="546" stroke="#1B1E22"/>
    <line x1="710" y1="496" x2="710" y2="546" stroke="#1B1E22"/>
    <text x="478" y="509" font-size="8" fill="#6b7077">EXEMPLE — NON CONTRACTUEL</text>
    <text x="478" y="534" fill="#1B1E22" font-weight="bold">BOLTCO — boltco.fr</text>
    <text x="628" y="509" fill="#6b7077">DESSINÉ : E.B.</text>
    <text x="628" y="534" fill="#1B1E22">ÉCH. : 1/100</text>
    <text x="718" y="509" fill="#6b7077">INDICE : A</text>
    <text x="718" y="534" fill="#1B1E22">FOLIO 1/1</text>
  </g>
</svg>
