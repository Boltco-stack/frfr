    <line x1="420" y1="290" x2="420" y2="318"/><rect x="408" y="318" width="24" height="30"/><line x1="413" y1="343" x2="427" y2="323"/><line x1="420" y1="348" x2="420" y2="380"/>
    <line x1="490" y1="290" x2="490" y2="318"/><rect x="478" y="318" width="24" height="30"/><line x1="483" y1="343" x2="497" y2="323"/><line x1="490" y1="348" x2="490" y2="380"/>
    <!-- ID3 -->
    <line x1="600" y1="290" x2="600" y2="318"/><rect x="588" y="318" width="24" height="30"/><line x1="593" y1="343" x2="607" y2="323"/><line x1="600" y1="348" x2="600" y2="380"/>
    <line x1="680" y1="290" x2="680" y2="318"/><rect x="668" y="318" width="24" height="30"/><line x1="673" y1="343" x2="687" y2="323"/><line x1="680" y1="348" x2="680" y2="380"/>
  </g>

  <!-- Calibres -->
  <g font-size="8.5" fill="#D9480F">
    <text x="98" y="312">10A</text><text x="168" y="312">16A</text><text x="238" y="312">16A</text>
    <text x="338" y="312">10A</text><text x="408" y="312">16A</text><text x="478" y="312">20A</text>
    <text x="588" y="312">32A</text><text x="668" y="312">20A</text>
