    <line x1="630" y1="190" x2="630" y2="220"/><rect x="614" y="220" width="32" height="36"/><line x1="620" y1="250" x2="640" y2="226"/>
  </g>
  <text x="140" y="212" font-size="9" fill="#1B1E22">ID1 40A 30mA AC</text>
  <text x="380" y="212" font-size="9" fill="#1B1E22">ID2 40A 30mA A</text>
  <text x="600" y="212" font-size="9" fill="#1B1E22">ID3 63A 30mA A</text>

