  <line x1="170" y1="256" x2="170" y2="290" stroke="#1B1E22" stroke-width="1.4"/>
  <line x1="320" y1="290" x2="520" y2="290" stroke="#1B1E22" stroke-width="1.8"/>
  <line x1="410" y1="256" x2="410" y2="290" stroke="#1B1E22" stroke-width="1.4"/>
