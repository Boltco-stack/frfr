  <g font-size="9" fill="#1B1E22">
    <text x="110" y="395" transform="rotate(45 110 395)">ÉCLAIRAGE RDC</text>
    <text x="180" y="395" transform="rotate(45 180 395)">PRISES SÉJOUR</text>
    <text x="250" y="395" transform="rotate(45 250 395)">PRISES CUISINE</text>
    <text x="350" y="395" transform="rotate(45 350 395)">ÉCLAIRAGE ÉTAGE</text>
    <text x="420" y="395" transform="rotate(45 420 395)">PRISES CHAMBRES</text>
    <text x="490" y="395" transform="rotate(45 490 395)">LAVE-LINGE</text>
    <text x="600" y="395" transform="rotate(45 600 395)">PLAQUES CUISSON</text>
    <text x="680" y="395" transform="rotate(45 680 395)">FOUR</text>
  </g>

  <!-- Cartouche -->
  <g font-size="9">
    <rect x="470" y="496" width="316" height="50" fill="#FAFAF7" stroke="#1B1E22" stroke-width="1.6"/>
    <line x1="470" y1="514" x2="786" y2="514" stroke="#1B1E22"/>
    <line x1="620" y1="496" x2="620" y2="546" stroke="#1B1E22"/>
    <line x1="710" y1="496" x2="710" y2="546" stroke="#1B1E22"/>
    <text x="478" y="509" font-size="8" fill="#6b7077">EXEMPLE — NON CONTRACTUEL</text>
    <text x="478" y="534" fill="#1B1E22" font-weight="bold">BOLTCO — boltco.fr</text>
    <text x="628" y="509" fill="#6b7077">DESSINÉ : E.B.</text>
    <text x="628" y="534" fill="#1B1E22">ÉCH. : S.O.</text>
    <text x="718" y="509" fill="#6b7077">INDICE : A</text>
    <text x="718" y="534" fill="#1B1E22">FOLIO 1/1</text>
